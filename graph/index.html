<script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<script type="text/javascript">
  document.addEventListener('DOMContentLoaded', function() {
    // 获取刚刚 Hexo 生成的 JSON 数据
    fetch('/graph.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('graph-container');
        
        // Frame 主题风格的配置选项
        const options = {
          nodes: {
            shape: 'dot',
            scaling: { min: 6, max: 24 }, // 节点大小范围
            font: { 
              size: 14, 
              face: 'Inter, Roboto Mono, sans-serif', // 调用 Frame 主题内置字体
              color: '#666'
            },
            borderWidth: 1.5,
            shadow: { enabled: true, color: 'rgba(0,0,0,0.05)', size: 5, x: 2, y: 2 }
          },
          groups: {
            // 已创建的文章节点样式 (Frame 风格的深灰/黑色)
            resolved: {
              color: { background: '#fff', border: '#333', highlight: { background: '#f5f5f5', border: '#000' } },
              font: { color: '#333' }
            },
            // 未创建的空链接节点样式 (灰色虚线感)
            unresolved: {
              color: { background: '#fcfcfc', border: '#ccc', highlight: { background: '#f5f5f5', border: '#aaa' } },
              font: { color: '#aaa' }
            }
          },
          edges: {
            width: 1,
            color: { color: '#e0e0e0', highlight: '#999', hover: '#999' },
            smooth: { type: 'continuous' } // 让连线有柔和的弧度
          },
          physics: {
            // 引力算法：让关联节点聚拢，无关联节点散开
            barnesHut: { gravitationalConstant: -3000, centralGravity: 0.2, springLength: 120, springConstant: 0.04 },
            minVelocity: 0.75
          },
          interaction: {
            hover: true,
            zoomView: true,
            dragView: true
          }
        };

        // 适配暗黑模式 (如果 Frame 切换到了 dark mode)
        const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDarkMode) {
           options.groups.resolved.color = { background: '#222', border: '#ccc', highlight: { background: '#333', border: '#fff' } };
           options.groups.resolved.font.color = '#eee';
           options.groups.unresolved.color.border = '#555';
           options.groups.unresolved.color.background = '#1a1a1a';
           options.edges.color.color = '#333';
           container.style.borderColor = '#333';
        }

        const network = new vis.Network(container, data, options);
        
        // 添加点击事件：点击节点直接跳转到对应文章
        network.on('click', function(params) {
          if (params.nodes.length > 0) {
            const nodeId = params.nodes[0];
            const node = data.nodes.find(n => n.id === nodeId);
            if (node && node.url && node.url !== 'javascript:void(0);') {
              window.location.href = node.url;
            }
          }
        });
        
        // 鼠标悬浮变小手
        network.on("hoverNode", function () {
            network.canvas.body.container.style.cursor = 'pointer';
        });
        network.on("blurNode", function () {
            network.canvas.body.container.style.cursor = 'default';
        });
      });
  });
</script>
