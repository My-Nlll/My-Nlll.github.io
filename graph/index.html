    <meta name="color-scheme" content="light dark">
    <script>
        (() => {
            const colorPreference = window.matchMedia('(prefers-color-scheme: dark)');
            const applyColorMode = event => {
                const colorMode = event.matches ? 'dark' : 'default';
                document.documentElement.dataset.colorMode = colorMode;
                document.documentElement.style.colorScheme = event.matches ? 'dark' : 'light';
                window.dispatchEvent(new CustomEvent('frame:color-mode-change', {
                    detail: { colorMode }
                }));
            };

            applyColorMode(colorPreference);
            if (colorPreference.addEventListener) {
                colorPreference.addEventListener('change', applyColorMode);
            } else {
                colorPreference.addListener(applyColorMode);
            }
        })();
    </script>

<details id="graph-node-directory" class="graph-node-directory">
  <summary id="graph-node-directory-summary" class="graph-node-directory-summary">文章节点列表（正在加载）</summary>
  <p class="graph-node-directory-help">已创建的文章显示为链接，未创建的节点显示为不可点击文本。</p>
  <ul id="graph-node-list" class="graph-node-list" aria-labelledby="graph-node-directory-summary">
    <li class="graph-node-directory-status">正在加载文章节点…</li>
  </ul>
</details>
<script type="text/javascript" src="../vendor/vis-network/vis-network.min.js"></script>
<script type="text/javascript">
  document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('graph-container');
    const nodeDirectorySummary = document.getElementById('graph-node-directory-summary');
    const nodeList = document.getElementById('graph-node-list');
    let nodeDirectoryLoaded = false;

    const showLoadError = function(error) {
      console.error('[Knowledge Graph] Failed to load:', error);
      container.textContent = '知识图谱加载失败，请刷新后重试。';
      container.setAttribute('role', 'alert');
      container.style.display = 'flex';
      container.style.alignItems = 'center';
      container.style.justifyContent = 'center';
      container.style.color = 'var(--color-text-secondary, #888)';

      if (nodeDirectoryLoaded) return;

      nodeDirectorySummary.textContent = '文章节点列表（加载失败）';
      nodeList.replaceChildren();
      const status = document.createElement('li');
      status.className = 'graph-node-directory-status';
      status.textContent = '文章节点加载失败，请刷新后重试。';
      nodeList.appendChild(status);
    };

    const renderNodeDirectory = function(nodes) {
      const sortedNodes = [...nodes].sort((left, right) => String(left.label).localeCompare(
        String(right.label),
        undefined,
        { numeric: true, sensitivity: 'base' }
      ));
      const resolvedCount = sortedNodes.filter(node => node.group === 'resolved' && node.url).length;
      const unresolvedCount = sortedNodes.length - resolvedCount;

      nodeDirectoryLoaded = true;
      nodeDirectorySummary.textContent = `文章节点列表（${resolvedCount} 篇文章，${unresolvedCount} 个未创建节点）`;
      nodeList.replaceChildren();

      sortedNodes.forEach(node => {
        const item = document.createElement('li');
        item.className = 'graph-node-item';

        if (node.group === 'resolved' && node.url) {
          const link = document.createElement('a');
          link.className = 'graph-node-link';
          link.href = node.url;
          link.textContent = String(node.label);
          item.appendChild(link);
        } else {
          const label = document.createElement('span');
          label.className = 'graph-node-unresolved';
          label.textContent = String(node.label);
          item.appendChild(label);

          const state = document.createElement('span');
          state.className = 'graph-node-state';
          state.textContent = '未创建';
          item.appendChild(state);
        }

        nodeList.appendChild(item);
      });
    };

    // 获取刚刚 Hexo 生成的 JSON 数据
    fetch('../graph.json')
      .then(res => {
        if (!res.ok) {
          throw new Error(`graph.json request failed with HTTP ${res.status}`);
        }
        return res.json();
      })
      .then(data => {
        if (!data || !Array.isArray(data.nodes) || !Array.isArray(data.edges)) {
          throw new Error('graph.json does not contain valid nodes and edges arrays.');
        }

        renderNodeDirectory(data.nodes);

        if (!window.vis || !window.vis.Network) {
          throw new Error('vis-network failed to load.');
        }

        // Frame 主题风格的配置选项
        const options = {
          layout: {
            // 固定布局种子，避免每次刷新后节点群位置发生随机变化
            randomSeed: 20260714
          },
          nodes: {
            shape: 'dot',
            scaling: { min: 6, max: 24 }, // 节点大小范围
            font: { 
              size: 14, 
              face: 'Inter, Roboto Mono, sans-serif' // 调用 Frame 主题内置字体
            },
            borderWidth: 1.5,
            shadow: { enabled: true, color: 'rgba(0,0,0,0.05)', size: 5, x: 2, y: 2 }
          },
          edges: {
            width: 1,
            smooth: { type: 'continuous' } // 让连线有柔和的弧度
          },
          physics: {
            // 引力算法：让关联节点聚拢，无关联节点散开
            barnesHut: { gravitationalConstant: -3000, centralGravity: 0.2, springLength: 120, springConstant: 0.04 },
            minVelocity: 0.75
          },
          interaction: {
            hover: true,
            zoomView: true,
            dragView: true
          }
        };

        const network = new window.vis.Network(container, data, options);
        network.once('stabilized', function() {
          // 物理布局完成后重新适配一次，确保节点群以画布中心为基准显示
          network.fit({ animation: false });
        });
        const applyGraphColorMode = function() {
          const isDarkMode = document.documentElement.dataset.colorMode === 'dark';
          network.setOptions({
            nodes: {
              font: {
                size: 14,
                face: 'Inter, Roboto Mono, sans-serif',
                color: isDarkMode ? '#d5d5d5' : '#666'
              },
              shadow: {
                enabled: true,
                color: isDarkMode ? 'rgba(0,0,0,0.25)' : 'rgba(0,0,0,0.05)',
                size: 5,
                x: 2,
                y: 2
              }
            },
            groups: {
              resolved: {
                color: isDarkMode
                  ? { background: '#222', border: '#ccc', highlight: { background: '#333', border: '#fff' } }
                  : { background: '#fff', border: '#333', highlight: { background: '#f5f5f5', border: '#000' } },
                font: { color: isDarkMode ? '#eee' : '#333' }
              },
              unresolved: {
                color: isDarkMode
                  ? { background: '#1a1a1a', border: '#555', highlight: { background: '#333', border: '#aaa' } }
                  : { background: '#fcfcfc', border: '#ccc', highlight: { background: '#f5f5f5', border: '#aaa' } },
                font: { color: '#aaa' }
              }
            },
            edges: {
              color: {
                color: isDarkMode ? '#333' : '#e0e0e0',
                highlight: '#999',
                hover: '#999'
              }
            }
          });
          container.style.borderColor = isDarkMode ? '#333' : '';
        };

        applyGraphColorMode();
        window.addEventListener('frame:color-mode-change', applyGraphColorMode);

        const visualNetwork = container.querySelector('.vis-network');
        if (visualNetwork) {
          visualNetwork.setAttribute('aria-hidden', 'true');
          visualNetwork.removeAttribute('tabindex');
        }
        
        // 添加点击事件：点击节点直接跳转到对应文章
        network.on('click', function(params) {
          if (params.nodes.length > 0) {
            const nodeId = params.nodes[0];
            const node = data.nodes.find(n => n.id === nodeId);
            if (node && node.group === 'resolved' && node.url) {
              window.location.href = node.url;
            }
          }
        });
        
        // 只有可跳转的文章节点显示为可点击
        network.on("hoverNode", function (params) {
            const node = data.nodes.find(n => n.id === params.node);
            container.style.cursor = node && node.group === 'resolved' && node.url
              ? 'pointer'
              : 'default';
        });
        network.on("blurNode", function () {
            container.style.cursor = 'default';
        });
      })
      .catch(showLoadError);
  });
</script>
